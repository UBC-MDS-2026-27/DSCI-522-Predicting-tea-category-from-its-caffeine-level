# Adapted from DSCI_522_project-template-breast-cancer-predictor by Sky Sheng (MIT License)
# https://github.com/UBC-MDS/DSCI_522_project-template-breast-cancer-predictor/blob/main/_quarto.yml

project:
  render:
    - analysis/*.qmd

format:
  html:
    embed-resources: true
    toc: true
    format-links:
      - html
      - text: PDF
        href: https://github.com/UBC-MDS-2026-27/DSCI-522-Predicting-tea-category-from-its-caffeine-level/blob/main/analysis/tea-category-predictor.pdf
        icon: file-pdf

  # PDF via Typst, which comes with Quarto
  typst:
    # png figures for the PDF
    fig-format: png
    # shrink figures and tables to fit the page
    # (Typst code below; `x => ...` is a function of x)
    include-in-header:
      text: |
        #show image: it => layout(size => if it.width == auto or it.width <= size.width { it } else { image(it.source, width: size.width) })
        #show table: set text(size: 9pt)